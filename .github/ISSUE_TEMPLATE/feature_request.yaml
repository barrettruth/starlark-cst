name: Feature Request
description: Suggest a feature
title: 'feat: '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This crate is a parser and nothing else. Name resolution, `load()`
        following, type inference, labels and the build graph all belong in the
        consumer. See CONTRIBUTING.md for the scope.

  - type: checkboxes
    attributes:
      label: Prerequisites
      options:
        - label:
            I have searched [existing
            issues](https://github.com/barrettruth/starlark-cst/issues)
          required: true

  - type: textarea
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    attributes:
      label: Alternatives considered
